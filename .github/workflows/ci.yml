name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check package
        run: cargo check --locked --all-targets --all-features

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      # 캐시를 쓰지 않는다: 캐시된 의존성은 cargo의 rust-version 검사를 건너뛰어
      # MSRV 위반을 가린 전례가 있다 (1.85 toolchain으로 1.88 요구 의존성이 green).
      - name: Check package with MSRV
        run: cargo check --locked --all-targets --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.84.1
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

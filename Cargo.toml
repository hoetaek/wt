[package]
name = "wt"
version = "0.48.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Worktree-based agent orchestration harness"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hoetaek/wt"
homepage = "https://github.com/hoetaek/wt"
readme = "README.md"
keywords = ["git", "worktree", "agent", "cli", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "SECURITY.md",
    "src/**",
    "tests/**",
]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.16"
crossterm = "0.29"
getrandom = "0.4"
include_dir = "0.7"
nix = { version = "0.31.3", features = ["process", "signal"] }
notify = "8"
opener = "0.8.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = "0.4"
shell-words = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
toml = "1"
toml_edit = "0.25"
thiserror = "2"
ratatui = "0.30.1"
pulldown-cmark = "0.13"
syntect = "5"
unicode-width = "0.2"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# 직접 사용하지 않는 transitive dep(plist, ratatui-widgets 경유) 제약.
# time 0.3.48의 내부 impl이 ratatui-widgets의 blanket From impl과 E0119 coherence
# 충돌을 일으켜, --locked 없는 fresh resolution 빌드가 깨진다. upstream(time 또는
# ratatui-widgets)이 수정 버전을 내면 이 항목을 제거한다.
time = { version = ">=0.3.47, <0.3.50", default-features = false }

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[package.metadata.dist]
dist = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[profile.dist]
inherits = "release"
lto = "thin"

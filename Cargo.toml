[package]
name = "wt"
version = "0.29.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Git worktree workspace manager"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hoetaek/wt"
homepage = "https://github.com/hoetaek/wt"
readme = "README.md"
keywords = ["git", "worktree", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "SECURITY.md",
    "src/**",
    "tests/**",
]

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
cliclack = "0.5.4"
console = "0.16"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
toml = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[package.metadata.dist]
dist = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[profile.dist]
inherits = "release"
lto = "thin"

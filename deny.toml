[advisories]
yanked = "warn"
ignore = [
    # paste via ratatui 0.29; no safe upgrade available in the ratatui line.
    "RUSTSEC-2024-0436",
    # bincode via syntect 5 default features; this task intentionally adopts
    # leaf's syntect-based reader pipeline and there is no safe syntect upgrade.
    "RUSTSEC-2025-0141",
    # yaml-rust via syntect 5 default features; this task intentionally adopts
    # leaf's syntect-based reader pipeline and there is no safe syntect upgrade.
    "RUSTSEC-2024-0320",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "warn"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    # foldhash via ratatui — OSI-approved permissive
    "Zlib",
]

[licenses.private]
ignore = true

# Restrict the evaluated dependency graph to the targets we actually ship
# (see [package.metadata.dist] in Cargo.toml). Without this, cargo-deny also
# pulls Windows-only crates such as arboard's clipboard-win (BSL-1.0), which we
# never build or distribute.
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "wt"
version = "0.43.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Worktree-based agent orchestration harness"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hoetaek/wt"
homepage = "https://github.com/hoetaek/wt"
readme = "README.md"
keywords = ["git", "worktree", "agent", "cli", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "SECURITY.md",
    "src/**",
    "tests/**",
]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.16"
crossterm = "0.29"
getrandom = "0.4"
include_dir = "0.7"
nix = { version = "0.31.3", features = ["process", "signal"] }
notify = "8"
opener = "0.8.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = "0.3"
shell-words = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
toml = "1"
toml_edit = "0.25"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[package.metadata.dist]
dist = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[profile.dist]
inherits = "release"
lto = "thin"
